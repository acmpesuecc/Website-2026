{{ define "all-tags"}}
{{$PageData := .TemplateData}}
{{ template "head" .}}
{{template "niri-logic" .}}
    <main class="niri-vertical-track" id="niri-track-v">
        <div class="niri-horizontal-track" id="niri-track-h-root">
            <section class="niri-window" id="root-window" role="main" tabindex="-1">
                <div class="container site-main">
                    <header class="collection-hero">
                        <div class="hero-content">
                            <h1>{{ $PageData.Frontmatter.Title }}</h1>
                        </div>
                    </header>
                    <article class="content">
                        <section class="posts">
                            <div class="all-tags">
                                {{range .TagNames}}
                                <a href="/tags/{{.}}.html" fx-action="/tags/{{.}}.html" fx-main-page fx-target="#niri-track-v" fx-swap="beforeend" class="tag-pill">{{.}}</a>
                                {{end}}
                            </div>
                        </section>
                    </article>
                    <div id="chart" class="graph-container" aria-label="Tags graph" role="img"></div>
                    <script src="https://d3js.org/d3.v7.min.js"></script>
                    <script defer src="/static/scripts/graph.js"></script>
                </div>
            </section>
        </div>
    </main>
    {{template "footer" .}}
</body>
</html>
{{end}}
