{{define "header"}}
<!-- If the template for a particular url does not exist(posts.html), setting it to the specific page template data -->
{{ $PageData := index .DeepDataMerge.Templates .PageURL }} {{if eq $PageData nil
}} {{ $PageData = .TemplateData }} {{end}}

<header class="site-header">
    <div class="container header-inner">
        <div class="brand">
            <a href="/" aria-label="{{ .DeepDataMerge.LayoutConfig.SiteTitle }}"><img src="/static/images/anna.png"
                    alt="{{ .DeepDataMerge.LayoutConfig.SiteTitle }}" class="brand-logo" /></a>
        </div>
        <nav id="mobile-nav" class="site-nav" aria-label="Main navigation">
            {{range $index_no, $map := .DeepDataMerge.LayoutConfig.Navbar}}
            {{range $key, $value := $map}}
            <a class="navitem" href="/{{ $value }}">{{ $key }}</a>
            {{end}}
            {{end}}
        </nav>
        <div class="actions">
            <button class="hamburger" id="hamburger" aria-controls="mobile-nav" aria-expanded="false"
                aria-label="Open menu">☰</button>
            <button class="search-btn" id="openSearch" aria-label="Search (Shift+K)">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--brand-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </div>
    </div>
</header>

<script>
    (function() {
        const hamburger = document.getElementById('hamburger');
        if (hamburger) {
            hamburger.addEventListener('click', (e) => {
                e.stopPropagation();
                document.body.classList.toggle('nav-open');
                const isOpen = document.body.classList.contains('nav-open');
                hamburger.setAttribute('aria-expanded', isOpen);
            });
        }
        
        document.addEventListener('click', (e) => {
            if (document.body.classList.contains('nav-open')) {
                const nav = document.getElementById('mobile-nav');
                if (nav && !nav.contains(e.target) && e.target !== hamburger) {
                    document.body.classList.remove('nav-open');
                    hamburger.setAttribute('aria-expanded', 'false');
                }
            }
        });

        const header = document.querySelector('.site-header');
        if (header) {
            header.addEventListener('mousemove', (e) => {
                const rect = header.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                header.style.setProperty('--header-mouse-x', `${x}px`);
                header.style.setProperty('--header-mouse-y', `${y}px`);
            });
        }

        const currentPath = window.location.pathname;
        const navItems = document.querySelectorAll('.site-nav .navitem');
        navItems.forEach(item => {
            const href = item.getAttribute('href');
            if (href) {
                const cleanPath = currentPath.replace(/\/$/, "");
                const cleanHref = href.replace(/\/$/, "");
                let isMatch = cleanPath === cleanHref || cleanPath.endsWith(cleanHref);
                if (!isMatch) {
                    if (cleanHref.endsWith("/collections/blogs.html") && cleanPath.includes("/blogs/")) isMatch = true;
                    else if (cleanHref.endsWith("/collections/members.html") && cleanPath.includes("/members/")) isMatch = true;
                    else if (cleanHref.endsWith("/collections/events.html") && cleanPath.includes("/events/")) isMatch = true;
                    else if (cleanHref.endsWith("/collections/announcements.html") && cleanPath.includes("/announcements/")) isMatch = true;
                }
                if (isMatch) {
                    item.classList.add('active');
                }
            }
        });
    })();
</script>
{{end}}
