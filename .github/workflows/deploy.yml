name: Deploy Site

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false # Important: Let them finish to ensure cache is updated

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ${{ steps.prep.outputs.path }}
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.25.3"

      - name: Cache build tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            /tmp/anna
            ~/go/pkg/mod
          key: ${{ runner.os }}-build-tools-${{ hashFiles('ci/patch_anna.py') }}
          restore-keys: |
            ${{ runner.os }}-build-tools-

      - name: Clone and Patch anna
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/anna-ssg/anna.git /tmp/anna
          cd /tmp/anna
          go get github.com/zmtcreative/gm-alert-callouts@latest
          cd ${{ github.workspace }}
          python3 ci/patch_anna.py /tmp/anna

      - name: Build patched anna binary
        working-directory: /tmp/anna
        run: |
          if [ ! -f ./anna ]; then
            go mod tidy
            go build -o ./anna .
          fi
          echo "/tmp/anna" >> $GITHUB_PATH

      - name: Build Site
        run: anna

      - name: Prepare build directory
        id: prep
        run: |
          ./ci/prepare_build.sh \
            "${{ github.event.repository.name }}" \
            "${{ github.event_name }}" \
            "${{ github.event.number }}"

      - name: Cache build output
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.prep.outputs.path }}
          key: build-${{ steps.prep.outputs.path }}-${{ github.run_id }}

  cleanup-cache:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR cache
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const prNumber = context.payload.pull_request.number;
            const cacheKeyPrefix = `build-PR${prNumber}-`;

            const caches = await github.rest.actions.getActionsCacheList({
              owner: repo.owner,
              repo: repo.repo,
            });

            for (const cache of caches.data.actions_caches) {
              if (cache.key.startsWith(cacheKeyPrefix)) {
                core.info(`Deleting cache: ${cache.key}`);
                await github.rest.actions.deleteActionsCacheById({
                  owner: repo.owner,
                  repo: repo.repo,
                  cache_id: cache.id,
                });
              }
            }

  deploy:
    runs-on: ubuntu-latest
    needs: [build, cleanup-cache]
    if: always() && (needs.build.result == 'success' || needs.cleanup-cache.result == 'success' || (github.event_name == 'push' && needs.build.result == 'success'))
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download all build caches
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;

            // 1. Get all caches
            const caches = await github.rest.actions.getActionsCacheList({
              owner: repo.owner,
              repo: repo.repo,
            });

            // 2. Get all open PRs
            const openPRs = await github.rest.pulls.list({
              owner: repo.owner,
              repo: repo.repo,
              state: 'open'
            });
            const openPRNumbers = new Set(openPRs.data.map(pr => pr.number));

            const targets = {};
            for (const cache of caches.data.actions_caches) {
              if (cache.key.startsWith('build-')) {
                const parts = cache.key.split('-');
                const name = parts[1]; // main_site or PRxx

                // Only include if it's main_site OR if it's an OPEN PR
                if (name === 'main_site' || (name.startsWith('PR') && openPRNumbers.has(parseInt(name.substring(2))))) {
                   if (!targets[name] || new Date(cache.created_at) > new Date(targets[name].created_at)) {
                    targets[name] = cache;
                  }
                }
              }
            }

            core.info(`Found active targets: ${Object.keys(targets).join(', ')}`);
            return targets;
          id: get-caches

      - name: Restore and Merge
        run: |
          chmod +x ./ci/merge_previews.sh
          ./ci/merge_previews.sh \
            '${{ steps.get-caches.outputs.result }}' \
            "${{ github.event.action }}" \
            "${{ github.event.number }}" \
            "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 Preview ready at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/PR${{ github.event.number }}/
          comment_tag: preview-link
