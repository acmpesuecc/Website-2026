{{ define "all-tags"}}
{{$PageData := .TemplateData}}
{{ template "head" .}}
<body class="site-body">
    {{template "header" .}}
    <main class="container site-main" role="main">
        <header class="collection-hero">
            <div class="hero-content">
                <h1>{{ $PageData.Frontmatter.Title }}</h1>
            </div>
        </header>
        <article class="content">
            <section class="posts">
                <div class="all-tags">
                    {{range .TagNames}}
                    <a href="/tags/{{.}}.html" class="tag-pill">{{.}}</a>
                    {{end}}
                </div>
            </section>
        </article>
        <div id="chart" class="graph-container" aria-label="Tags graph" role="img"></div>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script defer src="/static/scripts/graph.js"></script>
    </main>
    {{template "footer" .}}
</body>
</html>
{{end}}
