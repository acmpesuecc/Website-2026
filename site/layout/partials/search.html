{{define "search"}}
<!-- Overlay search activated with Cmd/Ctrl+K or search icon -->
<div class="search-overlay" id="searchOverlay" aria-hidden="true">
  <div class="search-box" role="dialog" aria-modal="true" aria-label="Search">
    <div class="search-input-row">
      <input id="searchSiteInput" type="text" placeholder="Search posts or pages — fuzzy search" autocomplete="off"
        aria-label="Search site" />
      <button id="closeSearch" class="close-search" aria-label="Close search">✕</button>
    </div>
    <div class="search-hint">Show fuzzy search — try partial words or titles</div>
    <div id="site_search_result" class="search-results"></div>
  </div>
</div>
<script>
  (function () {
    const overlay = document.getElementById('searchOverlay');
    const input = document.getElementById('searchSiteInput');
    const results = document.getElementById('site_search_result');
    const openBtns = document.querySelectorAll('#openSearch, .fab-search, .search-btn');
    const closeBtn = document.getElementById('closeSearch');

    function getBasePath() {
      const parts = window.location.pathname.split('/');
      if (parts[1] === 'Website-2026') {
        if (parts[2] && /^PR\d+$/.test(parts[2])) {
          return '/Website-2026/' + parts[2];
        }
        return '/Website-2026';
      }
      return '';
    }

    function getParentCollectionURL(path) {
      const basePath = getBasePath();
      let relativePath = path;
      if (basePath && path.startsWith(basePath)) {
        relativePath = path.substring(basePath.length);
      }

      if (relativePath.startsWith('/blogs/') && relativePath !== '/blogs/index.html' && relativePath !== '/collections/blogs.html') {
        return basePath + '/collections/blogs.html';
      }
      if (relativePath.startsWith('/events/') && relativePath !== '/events/index.html' && relativePath !== '/collections/events.html') {
        return basePath + '/collections/events.html';
      }
      if (relativePath.startsWith('/members/') && relativePath !== '/members/index.html' && relativePath !== '/collections/members.html') {
        return basePath + '/collections/members.html';
      }
      if (relativePath.startsWith('/announcements/') && relativePath !== '/announcements/index.html' && relativePath !== '/collections/announcements.html') {
        return basePath + '/collections/announcements.html';
      }
      return null;
    }

    function clickLink(l) {
      if (l.__fixi) {
        l.click();
      } else {
        setTimeout(() => clickLink(l), 5);
      }
    }

    function openPageFromSearch(targetPath) {
      const parentURL = getParentCollectionURL(targetPath);
      if (!parentURL) {
        // Top-level page: open directly as a new window/track
        const link = document.createElement('a');
        link.setAttribute('fx-action', targetPath);
        link.setAttribute('fx-main-page', '');
        link.style.display = 'none';
        document.body.appendChild(link);
        link.addEventListener('fx:end', () => {
          link.remove();
        });
        clickLink(link);
        return;
      }

      const parentWin = document.querySelector('.niri-window[data-url="' + parentURL + '"]');
      if (parentWin) {
        const track = parentWin.closest('.niri-horizontal-track');
        if (track) {
          const subWin = track.querySelector('.niri-window[data-url="' + targetPath + '"]');
          if (subWin) {
            document.body.classList.remove("overview-mode");
            subWin.focus({ preventScroll: true });
            setTimeout(() => {
              subWin.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
            }, 50);
          } else {
            const link = document.createElement('a');
            link.setAttribute('fx-action', targetPath);
            link.style.display = 'none';
            track.appendChild(link);
            link.addEventListener('fx:end', () => {
              link.remove();
            });
            clickLink(link);
          }
        }
      } else {
        // Parent window not open. Listen for fx:end, then open subpage
        const onEnd = function (e) {
          if (e.detail.cfg.action === parentURL) {
            document.removeEventListener('fx:end', onEnd);
            const newParentWin = document.querySelector('.niri-window[data-url="' + parentURL + '"]');
            if (newParentWin) {
              const track = newParentWin.closest('.niri-horizontal-track');
              if (track) {
                const link = document.createElement('a');
                link.setAttribute('fx-action', targetPath);
                link.style.display = 'none';
                track.appendChild(link);
                link.addEventListener('fx:end', () => {
                  link.remove();
                });
                clickLink(link);
              }
            }
          }
        };
        document.addEventListener('fx:end', onEnd);

        // Open parent track
        const navLink = document.querySelector('.site-header a[fx-action="' + parentURL + '"]');
        if (navLink) {
          navLink.click();
        } else {
          const link = document.createElement('a');
          link.setAttribute('fx-action', parentURL);
          link.setAttribute('fx-main-page', '');
          link.style.display = 'none';
          document.body.appendChild(link);
          link.addEventListener('fx:end', () => {
            link.remove();
          });
          clickLink(link);
        }
      }
    }

    function show() {
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      input.focus();
      const helpModal = document.getElementById('help-modal');
      if (helpModal && helpModal.open) {
        helpModal.close();
      }
    }
    function hide() { overlay.classList.remove('open'); overlay.setAttribute('aria-hidden', 'true'); input.value = ''; results.innerHTML = ''; }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hide(); return; }

      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
        return;
      }
      if ((e.key === 'k' || e.key === 'K' || e.code === 'KeyK') && e.shiftKey && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        show();
      }
    });

    openBtns.forEach(btn => btn.addEventListener('click', function () { show(); }));
    if (closeBtn) closeBtn.addEventListener('click', function () { hide(); });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) hide(); });

    const searchBox = document.querySelector('.search-box');
    if (searchBox) {
      searchBox.addEventListener('mousemove', (e) => {
        const rect = searchBox.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        searchBox.style.setProperty('--mouse-x', `${x}px`);
        searchBox.style.setProperty('--mouse-y', `${y}px`);

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const tiltX = -(y - centerY) / centerY * 3.5;
        const tiltY = (x - centerX) / centerX * 3.5;

        searchBox.style.setProperty('--tilt-x', `${tiltX}deg`);
        searchBox.style.setProperty('--tilt-y', `${tiltY}deg`);
      });

      searchBox.addEventListener('mouseleave', () => {
        searchBox.style.setProperty('--tilt-x', '0deg');
        searchBox.style.setProperty('--tilt-y', '0deg');
      });
    }

    // search logic (debounced simple implementation)
    let timeout; input.addEventListener('input', function () {
      clearTimeout(timeout); timeout = setTimeout(() => {
        const q = input.value.trim().toLowerCase(); if (!q) { results.innerHTML = ''; return }
        fetch(getBasePath() + '/static/index.json').then(r => r.json()).then(data => {
          results.innerHTML = '';
          let found = false;
          for (key in data) {
            const title = data[key]['Frontmatter']['Title'] || '';
            if (title.toLowerCase().includes(q)) {
              found = true;
              const a = document.createElement('a');
              a.textContent = title;
              const path = getBasePath() + '/' + data[key]['CompleteURL'];
              a.href = path;
              a.className = 'search-link';
              a.addEventListener('click', function (e) {
                e.preventDefault();
                hide();
                openPageFromSearch(path);
              });
              results.appendChild(a);
              results.appendChild(document.createElement('br'));
            }
          }
          if (!found) results.textContent = 'No results';
        }).catch(err => { console.error(err); results.textContent = 'Search unavailable' })
      }, 180)
    });
  })();
</script>
{{end}}
