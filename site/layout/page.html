{{ define "page"}}
{{$PageData := index .DeepDataMerge.Templates .PageURL}}
{{ template "head" .}}
<body class="site-body">
    <main class="container site-main">
        <article class="content">
            <h1>{{ $PageData.Frontmatter.Title }}</h1>
            {{$PageData.Body}}
        </article>
    </main>
</body>
</html>
{{ end }}
